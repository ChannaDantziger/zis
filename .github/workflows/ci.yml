name: Verify Docker images

on:
  pull_request:
    branches: [master, production]

permissions:
  contents: read

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zis-api
    env:
      RUN_DB_INTEGRATION: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build API image
        run: docker build --file zis-api/Dockerfile --tag zis-api:ci .
      - name: Build storefront image
        run: docker build --file apps/storefront/Dockerfile --tag zis-storefront:ci .
      - name: Build admin image
        run: docker build --file apps/admin-mobile/Dockerfile --tag zis-admin:ci .
