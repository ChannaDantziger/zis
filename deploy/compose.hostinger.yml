name: zis
services:
  api:
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: production
      DATABASE_TARGET: production
      PORT: '3000'
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the deployment secret store}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in the deployment configuration}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY
        in the deployment secret store}
      CORS_ALLOWED_ORIGINS: https://${ZIS_STORE_HOST:?Set store host},https://${ZIS_ADMIN_HOST:?Set
        admin host}
      ORDER_CONFIRMATION_TOKEN_SECRET: ${ORDER_CONFIRMATION_TOKEN_SECRET:?Set ORDER_CONFIRMATION_TOKEN_SECRET
        in the deployment secret store}
      ORDER_CONFIRMATION_TOKEN_TTL_SECONDS: ${ORDER_CONFIRMATION_TOKEN_TTL_SECONDS:?Set
        the approved order confirmation lifetime}
    expose:
    - '3000'
    networks:
    - private
    labels:
      traefik.enable: 'false'
    image: ${ZIS_API_IMAGE:?Set the verified image digest}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  storefront:
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
    - private
    image: ${ZIS_STORE_IMAGE:?Set the verified image digest}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    labels:
    - traefik.enable=true
    - traefik.docker.network=zis-private
    - traefik.http.routers.zis-storefront.rule=Host(`${ZIS_STORE_HOST:?Set the storefront
      HTTPS hostname}`)
    - traefik.http.routers.zis-storefront.entrypoints=websecure
    - traefik.http.routers.zis-storefront.tls.certresolver=letsencrypt
    - traefik.http.routers.zis-storefront.service=zis-storefront
    - traefik.http.services.zis-storefront.loadbalancer.server.port=8080
  admin:
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
    - private
    image: ${ZIS_ADMIN_IMAGE:?Set the verified image digest}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    labels:
    - traefik.enable=true
    - traefik.docker.network=zis-private
    - traefik.http.routers.zis-admin.rule=Host(`${ZIS_ADMIN_HOST:?Set the admin HTTPS
      hostname}`)
    - traefik.http.routers.zis-admin.entrypoints=websecure
    - traefik.http.routers.zis-admin.tls.certresolver=letsencrypt
    - traefik.http.routers.zis-admin.service=zis-admin
    - traefik.http.services.zis-admin.loadbalancer.server.port=8080
networks:
  private:
    internal: false
    name: zis-private
