name: zis-preview

services:
  api:
    build:
      context: .
      dockerfile: zis-api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: production
      DATABASE_TARGET: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the deployment secret store}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in the deployment configuration}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY in the deployment secret store}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5174,http://localhost:5173}
      ORDER_CONFIRMATION_TOKEN_SECRET: ${ORDER_CONFIRMATION_TOKEN_SECRET:?Set ORDER_CONFIRMATION_TOKEN_SECRET in the deployment secret store}
      ORDER_CONFIRMATION_TOKEN_TTL_SECONDS: ${ORDER_CONFIRMATION_TOKEN_TTL_SECONDS:?Set the approved order confirmation lifetime}
    expose:
      - "3000"
    networks:
      - private

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5174:8080"
    networks:
      - private

  admin:
    build:
      context: .
      dockerfile: apps/admin-mobile/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:8080"
    networks:
      - private

networks:
  private:
    internal: false
